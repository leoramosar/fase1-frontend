<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAP - Portal de alumnos</title>
    <link rel="icon" href="img/ipap-favicon-32.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-barra: #0d3b52;
            --color-verde: #1a8f5e;
            --color-texto: #24313a;
            --color-fondo: #f4f6f7;
            --color-muted: #5b6b75;
            --font-sans: "Roboto", sans-serif;
        }
    </style>
</head>

<body class="flex min-h-screen flex-col bg-fondo font-sans text-texto antialiased">
    <header class="bg-barra shadow-md">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
            <img src="img/ipap-logo-horizontal-blanco.png" alt="Instituto Provincial de la Administración Pública"
                class="h-12 w-auto sm:h-16">
            <p class="hidden text-sm text-white/80 sm:block">Portal de alumnos</p>
        </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 sm:py-12">
        <div class="grid items-start gap-8 lg:grid-cols-2 lg:gap-12">
            <section>
                <h1 class="text-3xl font-bold leading-tight text-barra sm:text-4xl">Portal de alumnos</h1>
                <p class="mt-3 max-w-md text-base text-muted">
                    Ingresá con tu usuario o legajo para ver tus materias y novedades.
                </p>

                <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2">
                    <article>
                        <a href="https://ipap.rionegro.gov.ar/" target="_blank"
                            class="block overflow-hidden rounded-2xl shadow-md">
                            <img src="img/novedades_institucionales.png" alt="Novedades institucionales"
                                class="h-auto w-full">
                        </a>
                    </article>
                    <article>
                        <a href="https://www.canva.com/design/DAHALdXUE94/lVCILc0KzWASd5Xh7s-dUQ/view?utm_content=DAHALdXUE94&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h107b5156df#2"
                            target="_blank"
                            class="block overflow-hidden rounded-2xl shadow-md">
                            <img src="img/calendario_academico.png" alt="Calendario académico" class="h-auto w-full">
                        </a>
                    </article>
                </div>
            </section>

            <section class="rounded-2xl bg-white p-6 shadow-lg sm:p-8">
                <h2 class="text-2xl font-bold text-barra">Ingresar</h2>
                <p class="mt-1 text-sm text-muted">Completá tus datos para entrar.</p>

                <form class="mt-6 flex flex-col gap-4" id="form-login" action="/login" method="post">
                    <div>
                        <label for="usuario" class="mb-1.5 block text-sm font-medium text-texto">Usuario o legajo</label>
                        <div class="relative">
                            <i class="ti ti-user pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-lg text-barra/50"
                                aria-hidden="true"></i>
                            <input type="text" id="usuario" name="usuario" placeholder="Tu usuario o legajo"
                                autocomplete="username" required
                                class="w-full rounded-xl border border-slate-200 bg-fondo py-3 pr-4 pl-10 text-texto outline-none transition placeholder:text-slate-400 focus:border-verde focus:ring-4 focus:ring-verde/20">
                        </div>
                    </div>
                    <div>
                        <label for="clave" class="mb-1.5 block text-sm font-medium text-texto">Contraseña</label>
                        <div class="relative">
                            <i class="ti ti-lock pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-lg text-barra/50"
                                aria-hidden="true"></i>
                            <input type="password" id="clave" name="clave" placeholder="Tu contraseña"
                                autocomplete="current-password" required
                                class="w-full rounded-xl border border-slate-200 bg-fondo py-3 pr-4 pl-10 text-texto outline-none transition placeholder:text-slate-400 focus:border-verde focus:ring-4 focus:ring-verde/20">
                        </div>
                    </div>
                    <button type="submit"
                        class="mt-2 cursor-pointer rounded-full bg-barra px-6 py-3 text-base font-semibold text-white shadow-sm transition hover:bg-verde focus:ring-4 focus:ring-verde/30 focus:outline-none">
                        Ingresar
                    </button>
                </form>
            </section>
        </div>
    </main>

    <footer class="mt-auto bg-barra text-white">
        <div class="mx-auto flex max-w-6xl flex-col items-center gap-4 px-4 py-6 text-center">
            <h2 class="text-sm">IPAP - Instituto provincial de la administracion publica - 2026</h2>
            <div class="flex flex-wrap justify-center gap-3">
                <a href="https://www.facebook.com/ipaprionegro.org/" target="_blank" aria-label="Facebook"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 text-xl hover:bg-verde">
                    <i class="ti ti-brand-facebook"></i>
                </a>
                <a href="https://x.com/ipaprn" target="_blank" aria-label="X"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 text-xl hover:bg-verde">
                    <i class="ti ti-brand-x"></i>
                </a>
                <a href="https://www.instagram.com/ipaprn/?hl=es" target="_blank" aria-label="Instagram"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 text-xl hover:bg-verde">
                    <i class="ti ti-brand-instagram"></i>
                </a>
                <a href="https://www.youtube.com/channel/UCJqOSJTZzF0zyltt6C9C2PQ" target="_blank" aria-label="YouTube"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 text-xl hover:bg-verde">
                    <i class="ti ti-brand-youtube"></i>
                </a>
                <a href="contacto.html" aria-label="Contacto"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 text-xl hover:bg-verde">
                    <i class="ti ti-mail"></i>
                </a>
            </div>
        </div>
    </footer>
    <script src="/js/script.js"></script>
</body>

</html>
